[workspace]
members = ["crates/*", "domain"]
resolver = "2"


[workspace.dependencies]
csv = "1.4.0"
rust_decimal = "1.40.0"
clap = { version = "4.5.59", features = ["derive"] }
chrono = "0.4.43"
chrono-tz = "0.10.4"
rust_decimal_macros = "1.40.0"
bitflags = {version = "2.13.2", features = ["serde"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1.0"
log = "0.4"


